databases:
  - name: smart-campus-erp-db
    databaseName: smart_campus
    user: campus
    plan: free

services:
  - type: web
    name: smart-campus-erp-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input
    startCommand: python manage.py migrate --noinput && python -m gunicorn --chdir backend config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.14
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: smart-campus-erp-db
          property: connectionString
      - key: PUBLIC_FRONTEND_HOST
        fromService:
          type: web
          name: smart-campus-erp-frontend
          property: host
      - key: DJANGO_TIME_ZONE
        value: Asia/Kolkata
      - key: PASSWORD_RESET_URL
        sync: false
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: "true"
      - key: DEFAULT_FROM_EMAIL
        sync: false
      # Optional Redis for shared throttling across workers. Without it each
      # worker keeps its own counters. Render Key Value (or any Redis URL) works.
      - key: REDIS_URL
        sync: false

  - type: web
    name: smart-campus-erp-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_HOST
        fromService:
          type: web
          name: smart-campus-erp-api
          property: host
